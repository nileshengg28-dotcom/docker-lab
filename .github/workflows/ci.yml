name: ci-demo
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p output
          echo "app version 1.0" > output/app.txt
      - uses: actions/upload-artifact@v4
        with:
          name: output
          path: output/

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: output
          path: output
      - name: Test
        run: grep "nothing" output/app.txt

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploying to UAT..."
